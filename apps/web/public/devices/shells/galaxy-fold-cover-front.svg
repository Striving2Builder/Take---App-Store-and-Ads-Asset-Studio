<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 700" fill="none">
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4a4450"/>
      <stop offset="50%" stop-color="#1c1820"/>
      <stop offset="100%" stop-color="#32283a"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Fold cover  tall narrow phone -->
  <rect x="10" y="10" width="300" height="680" rx="36" fill="url(#bezel)" filter="url(#soft)" stroke="#6a6070" stroke-width="1.5"/>
  <rect x="16" y="16" width="288" height="668" rx="30" fill="#0a0a0c"/>
  <rect x="22" y="22" width="276" height="656" rx="24" fill="#12151c"/>
  <circle cx="160" cy="38" r="7" fill="#000" stroke="#2a2430"/>
  <text x="160" y="360" text-anchor="middle" fill="#3a3040" font-family="ui-monospace,monospace" font-size="11">FOLD COVER</text>
</svg>
